name: Temporary API dispatch diagnostic
on:
  push:
    paths:
      - '.github/workflows/dispatch-diagnostic.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch-clock-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Trigger only the clock diagnostic through the official API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/scheduler-diagnostic.yml/dispatches" -f ref=main
