name: Read-only full price-window validation
on:
  push:
    paths:
      - '.github/workflows/window.yml'
      - 'scripts/window_preflight.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-validation-writer
  cancel-in-progress: false
jobs:
  full-window:
    if: github.repository == 'yamatwo333/crypto-paper-lab' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/window_preflight.py
        id: collect
      - name: Read saved evidence in a separate process
        if: always() && steps.collect.outcome != 'skipped'
        run: python scripts/window_preflight.py verify
      - name: Persist success or failure evidence without any account state
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          if [ ! -f validation/window.json ]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- validation/window.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save read-only full price-window validation'
          git push origin HEAD:main
