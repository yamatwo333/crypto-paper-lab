name: Separate paper comparison (approval required)
# No schedule until the user approves a distinct new experiment and validation completes.
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [tick, start]
        default: tick
        required: true
      confirm_new_experiment:
        type: string
        description: Exact approved experiment ID, only for a one-time new start
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: paper-validation-writer
  cancel-in-progress: false
jobs:
  forward-test:
    if: github.repository == 'yamatwo333/crypto-paper-lab' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/check_sources.py
      - name: Restore and run the unchanged comparison engine
        id: paper
        env:
          OPERATION: ${{ inputs.operation || 'tick' }}
          CONFIRM_EXPERIMENT: ${{ inputs.confirm_new_experiment }}
        run: python scripts/cloud_runner.py "$OPERATION" --confirm-new-experiment "$CONFIRM_EXPERIMENT"
      - name: Independently restore and replay the complete saved ledger
        if: steps.paper.outputs.prepared == 'true'
        run: python scripts/cloud_runner.py verify
      - name: Commit the complete experiment atomically
        if: success() && steps.paper.outputs.prepared == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- control.json experiments/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save verified forward-test observation'
          git push origin HEAD:main
      - name: Stop on denial or a failed persistence/verification step
        if: always() && (failure() || cancelled() || steps.paper.outputs.stop == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/paper.yml/disable"
